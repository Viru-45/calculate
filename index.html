<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, sleek, and responsive calculator web app built with HTML, CSS, and JavaScript.">
  <title>Modern Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-container">
    <div class="calculator-card" id="calculatorApp">
      <!-- Header -->
      <header class="calc-header">
        <div class="brand">
          <div class="status-indicator"></div>
          <h1>Calculator</h1>
        </div>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </header>

      <!-- Display Section -->
      <section class="display-container" aria-live="polite">
        <div class="previous-operand" id="previousOperand"></div>
        <div class="current-operand" id="currentOperand">0</div>
      </section>

      <!-- Keypad -->
      <div class="keypad">
        <button class="btn btn-function" id="btnClear" data-action="clear">AC</button>
        <button class="btn btn-function" id="btnDelete" data-action="delete">DEL</button>
        <button class="btn btn-function" id="btnPercent" data-action="percent">%</button>
        <button class="btn btn-operator" id="btnDivide" data-operator="÷">÷</button>

        <button class="btn btn-number" id="btn7" data-number="7">7</button>
        <button class="btn btn-number" id="btn8" data-number="8">8</button>
        <button class="btn btn-number" id="btn9" data-number="9">9</button>
        <button class="btn btn-operator" id="btnMultiply" data-operator="×">×</button>

        <button class="btn btn-number" id="btn4" data-number="4">4</button>
        <button class="btn btn-number" id="btn5" data-number="5">5</button>
        <button class="btn btn-number" id="btn6" data-number="6">6</button>
        <button class="btn btn-operator" id="btnSubtract" data-operator="-">-</button>

        <button class="btn btn-number" id="btn1" data-number="1">1</button>
        <button class="btn btn-number" id="btn2" data-number="2">2</button>
        <button class="btn btn-number" id="btn3" data-number="3">3</button>
        <button class="btn btn-operator" id="btnAdd" data-operator="+">+</button>

        <button class="btn btn-function" id="btnNegate" data-action="negate">±</button>
        <button class="btn btn-number" id="btn0" data-number="0">0</button>
        <button class="btn btn-number" id="btnDecimal" data-action="decimal">.</button>
        <button class="btn btn-equals" id="btnEquals" data-action="equals">=</button>
      </div>

      <!-- Quick Hint -->
      <footer class="calc-footer">
        <span>Keyboard friendly (0-9, +, -, *, /, Enter, Backspace, Esc)</span>
      </footer>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
